# Local dev infra: PostgreSQL + PostGIS and MinIO (S3-compatible object
# storage, CLAUDE.md §1) for complaint images. Matches DATABASE_URL /
# STORAGE_* in the root .env.example — replace with real credentials outside
# local dev; this compose file is not for production use.
#
# No Redis here — CLAUDE.md §13 (hackathon deployment) dropped the
# Redis-queue/worker architecture in favor of calling inference synchronously
# during submission. §6 documents the production-shaped async design this
# simplifies, for if that's ever revisited.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecora
    ports:
      - "5432:5432"
    volumes:
      - ecora_db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ecora"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - ecora_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the app expects (STORAGE_BUCKET) and exits.
  # `mc mb --ignore-existing` is idempotent, so this is safe to re-run on
  # every `docker compose up`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/ecora-uploads
      "

volumes:
  ecora_db_data:
  ecora_minio_data:
